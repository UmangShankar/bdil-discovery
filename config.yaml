# Bad Day In Leonida: discovery settings. Edit freely; the next run picks them up.

game_pattern: '\b(gta\s*-?\s*(6|vi)|grand\s+theft\s+auto\s+(6|vi))\b'

# Checked against the TITLE. Drops other games, news/hype, Shorts and anything not a real moment.
exclude_pattern: '(\bgta\s*-?\s*(v|5)\b|\bgtav\b|#shorts?\b|\bleak(ed|s)?\b|\bfake\b|\bconcept\b|fan[- ]?made|ai[- ]generated|unreal engine|\bue5\b|\bfivem\b|\bgta\s*rp\b|roleplay|gta online|compilation|\btop\s*\d+|tier list|trailer|\bfps\b|\d+\s*fps|refund|unboxing|download|pre-?load|pre-?stream|pre-?order|\bnews\b|rumou?r|countdown|days until|everything (new )?you missed|explained|theor(y|ies)|price|release date|\bps5 pro\b|reaction)'

brand_keywords: [fail, fails, wasted, busted, ragdoll, physics, glitch, bug, npc, npcs, cop, cops, police, chase,
  crash, crashed, explosion, explode, gator, alligator, florida man, karma, chaos, funny, lol, wtf, insane,
  bro, jump, fall, flew, launched, run over, arrested, rage, unlucky, worst, broke]

spoiler_keywords: [ending, final mission, plot twist, dies, death of, secret ending, story spoiler, spoiler]

scoring:
  # Content first (12 Nov): relevance (brand) + quality (engagement, outlier = views vs channel size),
  # then creator (rights). Raw velocity is downweighted because it mostly measures fame.
  weights: {brand: 30, engagement: 20, outlier: 20, velocity: 10, freshness: 10, rights: 10}
  tier_a: 65
  tier_b: 45
  brand_full_hits: 2        # this many keyword hits = full brand score

sources:
  youtube:
    enabled: true
    lookback_hours: 48
    min_views: 1500         # low floor so smaller creators with great moments get in
    min_duration_s: 180
    velocity_target: 2000   # views/hour for full marks
    max_results_per_query: 25
    queries:
      - GTA 6
      - GTA 6 funny
      - GTA 6 fails
      - GTA 6 police chase
      - GTA 6 physics
      - GTA 6 glitch
      - GTA 6 NPC
      - GTA 6 stream highlights
  twitch:
    enabled: true
    game_name: Grand Theft Auto VI
    lookback_hours: 48
    min_views: 150
    velocity_target: 300
  reddit:
    enabled: true
    lookback_hours: 48
    min_upvotes: 200
    velocity_target: 100
    subreddits: [GTA6, GTA, gaming, GamePhysics]

rights:
  # Evidence for every name: claude/rights-list.md in the "GTA CLipper Channel" project.
  # Matching is exact and case-insensitive on the YouTube channel title / Twitch broadcaster_name.
  # Everyone else shows rights=check and may be published under the check rules (1 a day per creator).
  allowlist_creators:       # creators with a clear public OK to clip (approved 12 Nov 2026)
    - hasanabi              # Twitch + YouTube. Condition: link his Twitch + socials in every description
  hold_creators:            # don't publish until a written yes; kept in the Sheet as rights=hold
    - ludwig
  blocklist_creators:       # rival clippers / creators with a record of claiming clip channels
    - ishowspeed            # copyright-claim history via Thumb Media (2022-25)
    - gta 6 central         # faceless GTA clip-compilation channel (rival)
    - daily dose of hasanabi
    - hasanabi productions
    - asmongold clips
    - asmontv
    - daily dose of xqc

backlog:
  shorts_per_day: 3
  days_of_cover: 3
  expire_hours: 72
